

<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Login</title>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet"
      href="./login.css">


</head>

<body>

<div class="container-fluid d-flex align-items-center justify-content-center min-vh-100 py-4 px-3">


<div class="auth-card">

    <div class="row g-0">

        <!-- Brand Panel -->
       <!-- Brand Panel -->

<div class="col-lg-5 d-none d-lg-flex brand-panel flex-column justify-content-center">


<div class="brand-content">

    <div class="brand-icon-badge mb-4">
        <i class="bi bi-buildings"></i>
    </div>

    <p class="brand-eyebrow">ROOVENA</p>

    <h1 class="brand-title">
        Stay somewhere<br>
        <span>worth remembering.</span>
    </h1>

    <p class="brand-description">
        A refined way to discover, book, and manage stays
        designed around comfort and unforgettable experiences.
    </p>

    <div class="brand-footer">
        <span class="brand-line"></span>
        <span>Stay well. Travel beautifully.</span>
    </div>

</div>


</div>

        <!-- Login Form -->
        <div class="col-lg-7">

            <div class="form-panel">

                <h2 class="h3 fw-bold mb-1">Sign In</h2>

                <p class="text-muted mb-4">
                    Enter your credentials to access your account
                </p>

                <form id="loginForm"
                      action="${pageContext.request.contextPath}/UserLogin"
                      method="POST">

                    <!-- Email -->
                    <div class="mb-3">

                        <label for="email" class="form-label fw-semibold">
                            Email
                        </label>

                        <div class="input-group icon-input">

                            <span class="input-group-text">
                                <i class="bi bi-envelope"></i>
                            </span>

                            <input type="email"
                                   id="email"
                                   name="email"
                                   class="form-control"
                                   placeholder="you@example.com"
                                   required
                                   autocomplete="email">

                        </div>

                    </div>

                    <!-- Password -->
                    <div class="mb-2">

                        <label for="password" class="form-label fw-semibold">
                            Password
                        </label>

                        <div class="input-group icon-input">

                            <span class="input-group-text">
                                <i class="bi bi-lock"></i>
                            </span>

                            <input type="password"
                                   id="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="Enter your password"
                                   required
                                   autocomplete="current-password">

                            <span class="input-group-text toggle-password"
                                  data-target="#password"
                                  role="button"
                                  aria-label="Show password">

                                <i class="bi bi-eye"></i>

                            </span>

                        </div>

                    </div>

                    <!-- Remember Me -->
                    <div class="d-flex justify-content-between align-items-center my-3">

                        <div class="form-check">

                            <input type="checkbox"
                                   class="form-check-input"
                                   id="remember"
                                   name="remember">

                            <label class="form-check-label text-muted"
                                   for="remember">
                                Remember me
                            </label>

                        </div>

                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="btn btn-gradient w-100">

                        <i class="bi bi-box-arrow-in-right me-1"></i>
                        Login

                    </button>

                </form>

                <!-- Registration -->
                <div class="text-center text-muted mt-4">

                    Don't have an account?

                    <a href="register.jsp"
                       class="link-primary-custom">
                        Sign up
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>


</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.querySelectorAll('.toggle-password').forEach(function (button) {

        button.addEventListener('click', function () {

            const input = document.querySelector(this.dataset.target);
            const icon = this.querySelector('i');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
                this.setAttribute('aria-label', 'Hide password');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
                this.setAttribute('aria-label', 'Show password');
            }

        });

    });
</script>

</body>
</html>
